name: CI/CD Pipeline

on:
  # Trigger on pull requests to main and develop branches
  pull_request:
    branches:
      - main
      - develop
  
  # Trigger on pushes to main and develop branches
  push:
    branches:
      - main
      - develop
  
  # Allow manual trigger from Actions tab
  workflow_dispatch:

# Permissions for GITHUB_TOKEN
permissions:
  contents: read
  pull-requests: write
  issues: write

# Cancel in-progress runs of the same workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Linting Job - Code Quality Gate
  # ============================================================================
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better caching
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'apps/backend/requirements.txt'
      
      - name: Install Node dependencies
        run: npm ci
      
      - name: Install Python dependencies
        working-directory: apps/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run ESLint & Prettier (TypeScript/JavaScript)
        run: npm run lint:js
        continue-on-error: false
      
      - name: Run Black & Flake8 (Python)
        run: npm run lint:py
        continue-on-error: false
      
      - name: Run Turborepo Lint (All Workspaces)
        run: npm run lint
        continue-on-error: false

  # ============================================================================
  # Type Check Job - TypeScript Type Safety
  # ============================================================================
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Type check TypeScript
        run: npx turbo run type-check

  # ============================================================================
  # Build Job - Compilation & Schema Generation
  # ============================================================================
  build:
    name: Build All Workspaces
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'apps/backend/requirements.txt'
      
      - name: Install Node dependencies
        run: npm ci
      
      - name: Install Python dependencies
        working-directory: apps/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Turborepo Build
        run: npm run build
        env:
          # Skip Next.js telemetry in CI
          NEXT_TELEMETRY_DISABLED: 1
      
      - name: Verify Schema Generation
        run: |
          if [ ! -f "packages/schemas/generated/models.ts" ]; then
            echo "❌ Schema generation failed - models.ts not found"
            exit 1
          fi
          echo "✅ Schema generation successful"
      
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            packages/schemas/dist/
            packages/schemas/generated/
          retention-days: 7

  # ============================================================================
  # Test Job - Unit & Integration Tests (when available)
  # ============================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'apps/backend/requirements.txt'
      
      - name: Install Node dependencies
        run: npm ci
      
      - name: Install Python dependencies
        working-directory: apps/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Turborepo Tests
        run: npm run test || echo "No tests configured yet"
        continue-on-error: true

  # ============================================================================
  # Security Audit Job
  # ============================================================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Run npm audit
        run: npm audit --audit-level=moderate || true
        continue-on-error: true
      
      - name: Check for known vulnerabilities
        run: |
          npx audit-ci --moderate || true
        continue-on-error: true

  # ============================================================================
  # Status Check - Summarize Results
  # ============================================================================
  status-check:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build, test]
    if: always()
    
    steps:
      - name: Check job statuses
        run: |
          echo "Lint: ${{ needs.lint.result }}"
          echo "Type Check: ${{ needs.typecheck.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Test: ${{ needs.test.result }}"
          
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ CI checks failed"
            exit 1
          fi
          
          echo "✅ All CI checks passed"
      
      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `
            ## 🚀 CI/CD Pipeline Results
            
            | Check | Status |
            |-------|--------|
            | Lint | ${{ needs.lint.result == 'success' && '✅ Passed' || '❌ Failed' }} |
            | Type Check | ${{ needs.typecheck.result == 'success' && '✅ Passed' || '❌ Failed' }} |
            | Build | ${{ needs.build.result == 'success' && '✅ Passed' || '❌ Failed' }} |
            | Tests | ${{ needs.test.result == 'success' && '✅ Passed' || '⚠️ Skipped' }} |
            
            **Commit:** \`${{ github.sha }}\`
            **Triggered by:** @${{ github.actor }}
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

